name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (dev lock, hashes required)
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m wpincidentlens --help
      - name: SBOM of the test environment (CycloneDX)
        run: |
          python -m venv "$RUNNER_TEMP/sca"
          "$RUNNER_TEMP/sca/bin/python" -m pip install --require-hashes -r requirements/audit.lock
          "$RUNNER_TEMP/sca/bin/cyclonedx-py" environment --of JSON --output-reproducible -o sbom-test-env.cdx.json "$(command -v python)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-test-env
          path: sbom-test-env.cdx.json
          if-no-files-found: error

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install audit tools (audit lock, hashes required)
        run: |
          python -m venv "$RUNNER_TEMP/sca"
          "$RUNNER_TEMP/sca/bin/python" -m pip install --require-hashes -r requirements/audit.lock
      # --disable-pip: lock jest w pełni przypięty z hashami, więc audyt czyta go wprost,
      # bez instalowania audytowanych pakietów do tymczasowego venv. Podatność = czerwone CI.
      - name: pip-audit (dev lock)
        run: '"$RUNNER_TEMP/sca/bin/pip-audit" -r requirements/dev.lock --require-hashes --disable-pip --strict'
      - name: pip-audit (audit lock)
        run: '"$RUNNER_TEMP/sca/bin/pip-audit" -r requirements/audit.lock --require-hashes --disable-pip --strict'

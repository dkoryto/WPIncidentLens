[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "wpincidentlens"
# Ta sama wersja co wpincidentlens.__version__ (tool_version w raporcie; test w tests/test_cli.py, ADR 0011).
version = "0.2.0rc1"
description = "WPIncidentLens: offline, statyczna analiza powłamaniowa kopii WordPressa"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []  # silnik analizy używa wyłącznie biblioteki standardowej

[project.optional-dependencies]
# jsonschema: wyłącznie do walidacji raportu w testach (ADR 0002 D2); silnik go nie importuje.
test = ["pytest>=9.0.3,<10", "pytest-cov>=5,<7", "jsonschema>=4.21,<5", "hypothesis>=6.100,<7"]
# yara: opcjonalny adapter YARA-X (ADR 0010), poza dev — domyślne środowisko i testy działają bez niego.
# Dokładna wersja; lock z hashami: requirements/yara.lock (uv pip compile requirements/yara.in --generate-hashes ...).
yara = ["yara-x==1.22.1"]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<7", "jsonschema>=4.21,<5", "ruff>=0.8,<0.9", "hypothesis>=6.100,<7"]

[project.scripts]
wpincidentlens = "wpincidentlens.cli:main"

[tool.setuptools]
packages = ["wpincidentlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "race: prawdziwy wyścig z osobnym procesem podmieniającym wpisy (kilka sekund); wyłączenie: -m \"not race\"",
]

[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = ["archives", "fixtures", "demo"]

[tool.ruff.lint]
# Baseline T-001: tylko błędy składni/nazw (pyflakes) i błędy krytyczne pycodestyle.
# Zasady stylu (E701/E702, formatowanie) celowo odłożone — monolit cli.py refaktoryzujemy stopniowo.
select = ["E9", "F"]

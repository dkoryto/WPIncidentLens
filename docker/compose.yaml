# Ograniczenia odpowiadają docker/run-flags.txt, z którymi CI mierzy kontener
# (.github/workflows/container.yml); zgodność sprawdza tests/test_container_probe.py.
# CI uruchamia też `command` poniżej z tymi samymi wolumenami i porównuje wynik z hostem.
services:
  wpincidentlens:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    read_only: true
    network_mode: "none"
    user: "65532:65532"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ../fixtures/site:/evidence/files:ro
      - ../fixtures/database.sql:/evidence/database.sql:ro
      - ../fixtures/logs:/evidence/logs:ro
      - ../results:/results:rw
    command: ["--files", "/evidence/files", "--database", "/evidence/database.sql", "--logs", "/evidence/logs", "--known-admin", "knownadmin", "--output", "/results", "--case-id", "DEMO-001"]
